name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Rigenera ogni mattina le pagine di condivisione di Ascolta (scripts/pagine-condivisione.mjs),
  # così le meditazioni pubblicate dopo l'ultimo push hanno l'anteprima con titolo e immagine.
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Le chiavi anon stanno in .env.production (pubbliche, protette da RLS).
      # Non iniettare secret vuoti: in Vite sovrascriverebbero il file.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
