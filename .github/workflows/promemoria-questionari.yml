name: Promemoria questionari T3

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama promemoria-questionari
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secret SUPABASE_FUNCTIONS_URL o CRON_SECRET mancanti: salta l'invio."
            exit 0
          fi
          curl -fsS -X POST "${SUPABASE_URL%/}/functions/v1/promemoria-questionari" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
